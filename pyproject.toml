[project]
name = "uae-project-radar"
version = "0.1.0"
description = "Watches public sources for UAE construction contract awards and alerts on the resulting hiring window."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "rapidfuzz>=3.9",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "respx"]
llm = ["anthropic>=0.40"]

[project.scripts]
radar = "radar.cli:app"
prep = "prep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar", "src/prep"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call expressions in argument defaults; that is the
# framework's documented API, not the mutable-default bug B008 exists to catch.
"src/radar/cli.py" = ["B008"]
"src/prep/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
