# Who you are, what you are aiming at, and what the agent should drill.
#
# Everything above `adaptive:` is YOURS. Edit it freely — the agent reads it
# every run and never rewrites it.
#
# Everything under `adaptive:` is MACHINE-MAINTAINED. `prep adapt` rewrites that
# block from your answer history and from the commands you send the bot. Hand
# edits there survive until the next adapt run, then get overwritten.
#
# Fields marked TODO were seeded from what the repo already knew about you.
# Correct them once and the questions get sharper immediately.

