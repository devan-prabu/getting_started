  licenses: [] # e.g. UAE driving licence, DM/DEWA/DCL approved engineer
  notice_period_days: 30 # TODO confirm — it comes up in every HR screen

# The move you are making. This is the single biggest driver of what gets asked.
target:
  primary_role: QA/QC Engineer — consultancy / PMC construction supervision
  secondary_role: QA/QC Engineer — contractor (listed / tier-1 main contractor)
  level: one step up from current — Senior QA/QC Engineer, Inspector, or ARE track
  employer_types: [consultancy, pmc, listed_contractor]
  emirates: [Dubai, Abu Dhabi]
  # Why you are moving. The behavioural and salary drills are built from this,
  # so keep it honest — it is never sent anywhere except into your own prompt.
  motivation: >-
    Move from contractor-side execution QA to the supervision/consultancy side,
    with a title and package that reflect the delivery record on Eden Hills.
  # Leave figures null if you would rather not store them; the negotiation drill
  # then works in ranges instead of numbers.
  compensation:
    current_aed_month: null # TODO
    target_min_aed_month: null # TODO — the number you will not go below
    target_stretch_aed_month: null # TODO
    must_beat_current: true
    non_salary_musts: [family status visa, annual ticket, medical for family]
  # Roughly when you expect to be sitting in interviews. The mix shifts toward
  # behavioural, company-specific and salary questions as this approaches.
  interview_window_from: null # TODO e.g. 2026-09-01
