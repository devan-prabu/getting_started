  companies_tier1:
    [Parsons, AECOM, KEO International Consultants, Egis Group, Stantec, WSP,
     Jacobs, AtkinsRéalis, Mott MacDonald, Hill International, Turner & Townsend,
     Arcadis, Mace, Bureau Veritas, Dar Al-Handasah, Khatib & Alami,
     Capital Engineering Consultancy, Cracknell]
  companies_tier2:
    [Larsen & Toubro, Consolidated Contractors Company, Ssangyong E&C, NMDC Group,
     ALEC, Shapoorji Pallonji, Convrgnt Value Engineering]

# What you can already defend under pressure. Drilled less often, but never to
# zero — an interviewer will open on your strongest ground.
strengths:
  - WIR / MIR / NCR / SOR / RFI registers and the full submittal cycle
  - Landscape and hardscape execution QA — interlock, kerbs, banding concrete, subbase
  - Water features, lagoons, pump rooms — waterproofing and water-tightness testing
  - Shop drawing and material submittal coordination with the consultant
  - ITP preparation and inspection sequencing on villa-scale landscape works

# The honest list. These get the most airtime until the scores say otherwise.
gaps:
  - Consultant-side vocabulary — supervision duties, RE/ARE structure, FIDIC clauses
  - ISO 9001:2015 clause-level answers (audits, CAR/PAR, management review)
  - Defending a rejection to a contractor rather than receiving one
  - Quantified achievements — rework %, first-time-pass rate, NCR closure time
  - Salary negotiation and framing the Proscape exit without sounding negative

# Interview stages you want covered. The scheduler rotates across these.
stages:
  - hr_screen
  - technical
  - consultant_panel
  - client_facing
  - behavioural

delivery:
  timezone: Asia/Dubai
  # Local hour the daily drill is sent. The workflow runs every 2 hours and
  # sends the first time it is at or past this hour with nothing sent today.
  ask_hour_local: 20
  questions_per_day: 3
  # Sunday gets a longer set — UAE working week starts Monday.
  weekend_questions: 5
  weekend_days: [Saturday, Sunday]

adaptive:
  # ------------------------------------------------------------------
  # MACHINE-MAINTAINED — rewritten by `prep adapt`. Do not hand-edit.
  # ------------------------------------------------------------------
  version: 1
  updated_at: null
  updated_reason: initial state, no answer history yet
  # Topics pushed to the front of the queue, strongest signal first.
  focus: []
  # Topics parked because they are consistently scoring well.
  resting: []
  # 1 = gentle, 5 = panel-grilling. Moves with your scores and with /harder.
  difficulty: 3
  # Free-text lines appended to the system prompt. Written by adapt from your
  # /goal, /target and /cv commands and from measured weak points.
  notes: []
