# Canonical contractor/developer names, aliases and careers pages.
#
# `radar init` loads this into the `companies` table. Phase 0 does not do fuzzy
# matching against it (that is normalise.py in Phase 2) — this file exists now
# so the schema and the loader are exercised and so the watchlist is captured
# while it is fresh.
#
# HONESTY NOTE (DECISIONS.md D-01): every `careers_url` below is an UNVERIFIED
# candidate. The build sandbox could not reach any of these hosts, so none were
# fetched. Confirm them before relying on the Phase 3 alert link.
#
# tier: 1 = top target, 2 = solid, 3 = fringe
# is_watchlist: 1 = alert loudly on anything this company wins

